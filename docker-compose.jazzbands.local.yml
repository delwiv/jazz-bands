name: jazzbands-local

# ============================================================================
# Jazz Bands Platform - Local Production Build Test
# ============================================================================
# Standalone local build of the production Dockerfile (node server.js + SANITY_PROXY cache).
# Includes its own Traefik on port 8012. No dependency on the dev stack.
#
# Usage:
#   docker compose -f docker-compose.jazzbands.local.yml up -d --build
#   docker compose -f docker-compose.jazzbands.local.yml logs -f
#   docker compose -f docker-compose.jazzbands.local.yml down
# ============================================================================

x-band-local: &band-local
  build:
    context: ./apps/jazz-bands
  restart: unless-stopped
  env_file: ./.env
  environment:
    - NODE_ENV=production
    - PORT=5173
    - SANITY_DATASET=staging
    - SANITY_STUDIO_DATASET=staging
    - SANITY_PROXY_URL=http://localhost:5173/sanity
    - SANITY_PURGE_TOKEN=${SANITY_PURGE_TOKEN}
  networks:
    - jazzbands-net

services:
  traefik:
    image: traefik:latest
    container_name: jazzbands-traefik-local
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=jazzbands-net"
      - "--entrypoints.web.address=:8012"
      - "--accesslog=true"
    ports:
      - "8012:8012"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - jazzbands-net
  boheme:
    <<: *band-local
    container_name: boheme-local
    environment:
      BAND_SLUG: boheme
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boheme-dev.entrypoints=web"
      - "traefik.http.routers.boheme-dev.rule=Host(`boheme-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.boheme-dev.loadbalancer.server.port=5173"

  canto:
    <<: *band-local
    container_name: canto-local
    environment:
      BAND_SLUG: canto
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.canto-dev.entrypoints=web"
      - "traefik.http.routers.canto-dev.rule=Host(`canto-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.canto-dev.loadbalancer.server.port=5173"

  jazzola:
    <<: *band-local
    container_name: jazzola-local
    environment:
      BAND_SLUG: jazzola
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jazzola-dev.entrypoints=web"
      - "traefik.http.routers.jazzola-dev.rule=Host(`jazzola-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.jazzola-dev.loadbalancer.server.port=5173"

  swing-family:
    <<: *band-local
    container_name: swing-family-local
    environment:
      BAND_SLUG: swing-family
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swing-family-dev.entrypoints=web"
      - "traefik.http.routers.swing-family-dev.rule=Host(`swing-family-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.swing-family-dev.loadbalancer.server.port=5173"

  trio-rsh:
    <<: *band-local
    container_name: trio-rsh-local
    environment:
      BAND_SLUG: trio-rsh
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trio-rsh-dev.entrypoints=web"
      - "traefik.http.routers.trio-rsh-dev.rule=Host(`trio-rsh-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.trio-rsh-dev.loadbalancer.server.port=5173"

  west-side-trio:
    <<: *band-local
    container_name: west-side-trio-local
    environment:
      BAND_SLUG: west-side-trio
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.west-side-trio-dev.entrypoints=web"
      - "traefik.http.routers.west-side-trio-dev.rule=Host(`west-side-trio-dev.jazz.wildredbeard.tech`)"
      - "traefik.http.services.west-side-trio-dev.loadbalancer.server.port=5173"

networks:
  jazzbands-net:
    driver: bridge
