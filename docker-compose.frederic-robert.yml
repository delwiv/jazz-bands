name: frederic-robert

# ============================================================================
# Frederic Robert Hub - Production Stack (Raspberry Pi)
# ============================================================================
# Services:
#   - traefik: HTTP routing only (like the jazzbands 8012 Traefik), bound to
#     127.0.0.1:8013 — no SSL, no certresolver (nginx terminates SSL on the host)
#   - hub: the React Router SSR app (port 5174 inside the container)
#
# Network flow:
#   Host nginx (80/443, SSL termination via certbot)
#     → www.frederic-robert.com
#     → Traefik (host 127.0.0.1:8013, HTTP)
#     → hub container
#
# TLS certificates for frederic-robert.com + www.frederic-robert.com are
# managed by certbot on the host (auto-renewal via certbot.timer).
# Nginx config: config/hub.frederic-robert.nginx.conf
#
# Usage:
#   docker compose -f docker-compose.frederic-robert.yml up -d --build
#   docker compose -f docker-compose.frederic-robert.yml logs -f
#   docker compose -f docker-compose.frederic-robert.yml down
# ============================================================================

services:
  traefik:
    image: traefik:latest
    container_name: frederic-robert-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=frederic-robert-net"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
    ports:
      - "127.0.0.1:8013:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - frederic-robert-net

  hub:
    build:
      context: ./apps/frederic-robert
    container_name: frederic-robert-hub
    restart: unless-stopped
    env_file: ./.env
    environment:
      - NODE_ENV=production
      - PORT=5174
      # Must match the dataset used by the band sites (references to band/musician docs)
      - SANITY_DATASET=${SANITY_DATASET:-staging}
      - SANITY_PROXY_URL=http://localhost:5174/sanity
      - SANITY_PURGE_TOKEN=${SANITY_PURGE_TOKEN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hub.rule=Host(`frederic-robert.com`) || Host(`www.frederic-robert.com`)"
      - "traefik.http.routers.hub.entrypoints=web"
      - "traefik.http.services.hub.loadbalancer.server.port=5174"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - frederic-robert-net

networks:
  frederic-robert-net:
    driver: bridge
