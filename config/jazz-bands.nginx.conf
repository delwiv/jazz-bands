# ============================================================================
# Jazz Bands - System Nginx Configuration
# ============================================================================
# Location: /etc/nginx/sites-enabled/jazz-bands.nginx.conf
# Purpose: Drop SSL termination and use transparent TCP stream for JWBT
#
# Architecture:
# - Port 80: HTTP (closes JWBT, serves ACME challenge to Traefik:4080)
# - Port 443: TCP Stream passthrough (raw TLS to Traefik:8443)
# - Host: Traefik manages all SSL for *.jazz.wildredbeard.tech
#
# Other apps: See separate files (this file is JWBT-only)
# ============================================================================

# --------------------------------------------------------------------------
# HTTP Block - Handle unencrypted traffic
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name *.jazz.wildredbeard.tech;
    
    # Logging (optional - remove if not needed on production server)
    access_log /var/log/nginx/jazz-bands-http-access.log combined;
    error_log /var/log/nginx/jazz-bands-http-error.log warn;
    
    # =================================================================
    # ACME Challenge — proxy to Traefik's built-in Let's Encrypt resolver
    # =================================================================
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8012/.well-known/acme-challenge/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # =================================================================
    # JWBT HTTP Traffic - Close Quietly
    # Port 80 JWBT hostnames are unsupported (close connection, no content)
    # Play: Return 444
    # =================================================================
    return 444;
}

# ============================================================================
# Stream Block - TCP Passthrough for JWBT
# ============================================================================
# This block is OUTSIDE of any http{} block
# It forwards raw interactivities (TCP level) from port 443 to Traefik:8443
# Nginx does NOT terminate SSL here - it just blindly forwards the TLS stream.
# SSL negotiation happens between client and Traefik (port 8443 in Docker)
# ============================================================================

# Note: This stream block must be included in nginx.conf (or the enclosing file must
# be .nginx default) if your nginx install uses separate stream{} contexts.
# If included via `include /etc/nginx/site-enabled/*`, nginx need not be configured.

stream {
    server {
        # Listen on port 1443, only for JWBT subdomains (SNI matching)
        # This listens on port 443 (standard HTTPS)
        listen 443;
        
        # This server responds to all *.jazz.wildredbeard.tech connections
        # We use the `server_name_pass`(proxy)s for SNI-based routing.
        # For TCP stream passthrough, if the client sends SNI through all prime,
        # it will match this server block and forward to Traefik:8443.
        server_name *.jazz.wildredbeard.tech;
        
        # Logging
        access_log /var/log/nginx/jazz-bands-ssl-access.log stream;  
        error_log /var/log/nginx/jazz-bands-ssl-error.log warn;
        
        # Forward raw TLS to Traefik (internal Docker port, not host:443)
        proxy_pass 127.0.0.1:8443;
        
        # Timeout for idle connections (seconds)
        proxy_timeout 10s;
        proxy_connect_timeout 600;
        
        # Fast response to dropped percent connections (optional)
        # keepalive_timeout 5s;
    }
}
