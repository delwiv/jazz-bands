# ============================================================================
# Frederic Robert Hub - System Nginx Configuration
# Location: /etc/nginx/conf.d/hub.frederic-robert.nginx.conf
# Purpose: SSL termination (certbot) + reverse proxy to the hub Traefik
#
# Architecture:
# - Port 80:  redirect to https://www.frederic-robert.com (canonical host)
#             + ACME webroot challenge for future renewals
# - Port 443: nginx terminates SSL with the wildcard cert
#             live/frederic-robert.com (covers frederic-robert.com + www)
#             then proxies HTTP to the hub Traefik on 127.0.0.1:8013
# - Traefik:  routing only (no SSL), same role as the jazzbands 8012 Traefik
#
# SSL certs are managed by certbot (auto-renewal via certbot.timer).
# The apex (frederic-robert.com) permanently redirects to www.
# ============================================================================

# --------------------------------------------------------------------------
# HTTP - redirect everything to https://www.frederic-robert.com
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name frederic-robert.com www.frederic-robert.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.frederic-robert.com$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS - apex (permanent redirect to www)
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name frederic-robert.com;

    ssl_certificate /etc/letsencrypt/live/frederic-robert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frederic-robert.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.frederic-robert.com$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS - www (proxy to the hub Traefik)
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name www.frederic-robert.com;

    ssl_certificate /etc/letsencrypt/live/frederic-robert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frederic-robert.com/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;

    location / {
        proxy_pass http://localhost:8013;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }
}
