name: jazzbands

# ============================================================================
# Jazz Bands Platform - Production Stack (Pi 4)
# ============================================================================
# Services:
#   - Traefik: HTTP/8012, routing only (SSL handled by external Traefik)
#   - 6 Band containers: 256MB limits each
#   - PostgreSQL: Umami database
#   - Umami: Web analytics
#
# Architecture:
#   External Traefik (SSL) → local Traefik:8012 (routing) → band:5173
#
# Usage:
#   docker-compose -f docker-compose.jazzbands.yml up -d
# ==============================================================================

x-band-prod: &band-prod
  image: ghcr.io/delwiv/jazz-bands:${COMPOSE_IMAGE_TAG:-latest}
  restart: always
  env_file:
    - .env
  environment:
    - NODE_ENV=production
    - PORT=5173
    - SANITY_DATASET=staging
    - SANITY_STUDIO_DATASET=staging
    - SANITY_PROXY_URL=http://localhost:5173/sanity
    - SANITY_PURGE_TOKEN=${SANITY_PURGE_TOKEN}
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 128M
  networks:
    - jazzbands-prod

services:
  # ==========================================================================
  # TRAEFIK - Production Router
  # ==========================================================================
  traefik:
    image: traefik:latest
    container_name: jazzbands-traefik-prod
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=jazzbands-prod"
      - "--entrypoints.web.address=:8012"
      - "--accesslog=true"
      - "--log.level=DEBUG"
    ports:
      - "8012:8012"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - jazzbands-prod

  boheme:
    <<: *band-prod
    container_name: boheme-prod
    environment:
      - BAND_SLUG=boheme
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_BOHEME}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boheme.rule=Host(`boheme.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.boheme.entrypoints=web"
      - "traefik.http.services.boheme.loadbalancer.server.port=5173"

  canto:
    <<: *band-prod
    container_name: canto-prod
    environment:
      - BAND_SLUG=canto
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_CANTO}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.canto.rule=Host(`canto.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.canto.entrypoints=web"
      - "traefik.http.services.canto.loadbalancer.server.port=5173"

  jazzola:
    <<: *band-prod
    container_name: jazzola-prod
    environment:
      - BAND_SLUG=jazzola
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_JAZZOLA}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jazzola.rule=Host(`jazzola.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.jazzola.entrypoints=web"
      - "traefik.http.services.jazzola.loadbalancer.server.port=5173"

  swing-family:
    <<: *band-prod
    container_name: swing-family-prod
    environment:
      - BAND_SLUG=swing-family
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_SWING_FAMILY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swing-family.rule=Host(`swing-family.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.swing-family.entrypoints=web"
      - "traefik.http.services.swing-family.loadbalancer.server.port=5173"

  trio-rsh:
    <<: *band-prod
    container_name: trio-rsh-prod
    environment:
      - BAND_SLUG=trio-rsh
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_TRIO_RSH}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.trio-rsh.rule=Host(`trio-rsh.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.trio-rsh.entrypoints=web"
      - "traefik.http.services.trio-rsh.loadbalancer.server.port=5173"

  west-side-trio:
    <<: *band-prod
    container_name: west-side-prod
    environment:
      - BAND_SLUG=west-side-trio
      - SANITY_API_READ_TOKEN=${SANITY_READ_TOKEN}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID_WEST_SIDE_TRIO}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.west-side-trio.rule=Host(`west-side-trio.jazz.wildredbeard.tech`)"
      - "traefik.http.routers.west-side-trio.entrypoints=web"
      - "traefik.http.services.west-side-trio.loadbalancer.server.port=5173"

  # ======================================================================
  # DATABASE (for Umami)
  # ======================================================================

  postgres:
    container_name: postgres-prod
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      shared_preload_libraries: ""
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=128MB
      -c max_connections=50
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - jazzbands-prod
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ======================================================================
  # ANALYTICS (Umami)
  # ======================================================================

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami-prod
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_SECRET: ${UMAMI_APP_SECRET}
      APP_NAME: Umami
      APP_PORT: 3000
      UMAMI_ANALYTICS_DOMAINS: ${UMAMI_ANALYTICS_DOMAINS}
    networks:
      - jazzbands-prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.umami-prod.entrypoints=web"
      - "traefik.http.routers.umami-prod.rule=Host(`analytics.jazz.wildredbeard.tech`)"
      - "traefik.http.services.umami-prod.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================================
# VOLUMES & NETWORKS
# ============================================================================

volumes:
  postgres-data:

networks:
  jazzbands-prod:
    name: jazzbands-prod
    driver: bridge
